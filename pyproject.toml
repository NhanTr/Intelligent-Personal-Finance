[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "finance-ml"
version = "0.1.0"
description = "Intelligent Personal Finance Decision Support System — Data & ML Pipeline (N1-N4)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26.0,<3.0.0",
    "pandas>=2.2.0,<3.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "joblib>=1.4.0,<2.0.0",
    "pydantic>=2.7.0,<3.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "nbformat>=5.10.0,<6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0,<9.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finance_ml"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
